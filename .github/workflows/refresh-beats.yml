name: Refresh News Beats (Scheduled Producer)

on:
  # Scheduled producer cron (Every 6 hours)
  # NOTE: Currently disabled to avoid unnecessary API credit consumption during maintenance.
  # Re-enable by running: gh workflow enable "Refresh News Beats (Scheduled Producer)"
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_beat:
        description: 'Specific beat slug to refresh (or leave blank for all)'
        required: false
        default: ''

jobs:
  refresh-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run beat synthesis producer script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_BEAT: ${{ github.event.inputs.force_beat }}
        run: node scripts/refresh-beats.js

      - name: Commit and push updated beat JSON data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated news beat synthesis [skip ci]" && git push)
